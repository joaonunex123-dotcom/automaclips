[pytest]
# Põe a raiz do repositório no sys.path para que `from db import repositorio` e
# `from sourcing.score import ...` resolvam nos testes sem instalar o pacote.
# Fora do pytest, os módulos rodam como `python -m sourcing.descobrir` (ver
# README) — que já coloca a raiz no path pelo mesmo motivo.
pythonpath = .
testpaths = tests
