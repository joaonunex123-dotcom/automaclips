<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="moldura">
  <div id="tela" data-tela="inicio">

    <header id="barra">
      <span class="marca">JARVIS</span>
      <span id="conexao" class="ponto" title="eventos ao vivo"></span>
      <span class="metricas">
        <span id="hora" class="hora">--:--</span>
        <span class="m"><small>TEMP</small><b id="m-temp">--</b></span>
        <span class="m"><small>CPU</small><b id="m-cpu">--</b></span>
        <span class="m"><small>RAM</small><b id="m-ram">--</b></span>
      </span>
    </header>

    <main class="telas">

      <section class="tela-conteudo" data-id="inicio">
        <div class="painel-mascote">
          <div class="mascote" data-mascote></div>
          <div id="rotulo" class="rotulo">descansando</div>
          <div id="tarefa" class="suave"></div>
        </div>
        <div class="painel-inicio">
          <div id="relogio" class="relogio">--:--</div>
          <div id="data" class="suave"></div>
          <div class="titulo-secao">Próximas</div>
          <ul id="proximas" class="lista"></ul>
        </div>
      </section>

      <section class="tela-conteudo" data-id="resposta">
        <div class="cabecalho-resposta">
          <div class="mascote mini" data-mascote></div>
          <div id="pergunta-atual" class="pergunta"></div>
        </div>
        <div id="resposta" class="texto-resposta"></div>
        <div id="metricas-resposta" class="metricas-resposta"></div>
        <form id="entrada" class="entrada" hidden autocomplete="off">
          <input id="campo" type="text" maxlength="4000" placeholder="Digite e pressione Enter">
          <button class="botao" type="submit">Enviar</button>
        </form>
      </section>

      <section class="tela-conteudo" data-id="agenda">
        <h2>Agenda</h2>
        <ul id="lista-agenda" class="lista"></ul>
      </section>

      <section class="tela-conteudo" data-id="notas">
        <h2>Notas</h2>
        <ul id="lista-notas" class="lista"></ul>
      </section>

      <section class="tela-conteudo" data-id="status">
        <h2>Status</h2>
        <div class="grade">
          <div class="cartao">
            <small>Temperatura</small>
            <b id="s-temp">--</b>
          </div>
          <div class="cartao">
            <small>CPU</small>
            <b id="s-cpu">--</b>
            <div class="barra"><i id="s-cpu-barra"></i></div>
          </div>
          <div class="cartao">
            <small>RAM</small>
            <b id="s-ram">--</b>
            <span id="s-ram-detalhe" class="det"></span>
            <div class="barra"><i id="s-ram-barra"></i></div>
          </div>
          <div class="cartao">
            <small>Uptime</small>
            <b id="s-uptime">--</b>
          </div>
        </div>
      </section>

    </main>

    <div id="aviso" class="aviso" hidden></div>

    <footer id="rodape">
      <span>1 falar · 2 próxima · 3 voltar</span>
      <span id="nome-tela"></span>
    </footer>

    <div id="login" hidden>
      <form id="form-login">
        <label for="token">Token do Jarvis</label>
        <input id="token" type="password" autocomplete="off">
        <button class="botao" type="submit">Entrar</button>
      </form>
    </div>

  </div>
</div>

<div id="controles" hidden>
  <button type="button" data-tecla="1">1 · falar</button>
  <button type="button" data-tecla="2">2 · próxima</button>
  <button type="button" data-tecla="3">3 · voltar</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
